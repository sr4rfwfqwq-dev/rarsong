<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karing — Подключение</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:
radial-gradient(circle at 15% 10%,#00a878 0,transparent 38%),
radial-gradient(circle at 90% 80%,#1670ad 0,transparent 42%),
linear-gradient(145deg,#061b1b,#073a36 45%,#071526);display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(650px,100%);padding:38px 30px 30px;border:1px solid rgba(255,255,255,.16);border-radius:30px;background:rgba(5,24,27,.68);backdrop-filter:blur(22px);box-shadow:0 28px 90px rgba(0,0,0,.4);text-align:center}
.logo{width:120px;height:120px;margin:0 auto 22px;border-radius:28px;object-fit:cover;box-shadow:0 14px 40px rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.18)}
h1{margin:0 0 9px;font-size:34px;letter-spacing:-1px}
.sub{margin:0 auto 28px;max-width:500px;color:#b8d7d1;line-height:1.55}
.import{display:block;text-decoration:none;color:#fff;background:linear-gradient(135deg,#00b37a,#087f9e);padding:17px 20px;border-radius:16px;font-weight:800;font-size:17px;box-shadow:0 12px 32px rgba(0,173,130,.25);transition:.2s;border:1px solid rgba(255,255,255,.14)}
.import:hover{transform:translateY(-2px);filter:brightness(1.08)}
.divider{display:flex;align-items:center;gap:12px;margin:30px 0 18px;color:#82aaa3;font-size:13px}
.divider:before,.divider:after{content:"";height:1px;background:rgba(255,255,255,.12);flex:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.download{text-decoration:none;color:#eaf7f4;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.055);padding:17px 10px;border-radius:16px;transition:.2s}
.download:hover{background:rgba(0,177,132,.13);border-color:rgba(70,220,177,.3);transform:translateY(-2px)}
.icon{font-size:25px;margin-bottom:8px}
.name{font-weight:750;font-size:14px}
.small{display:block;color:#7fa39e;font-size:11px;margin-top:4px}
.note{margin-top:22px;color:#66827e;font-size:12px;line-height:1.5}
@media(max-width:520px){.card{padding:30px 18px 22px}.logo{width:105px;height:105px}h1{font-size:28px}.grid{grid-template-columns:1fr}.download{display:flex;align-items:center;text-align:left;gap:12px;padding:13px 15px}.icon{margin:0;font-size:22px}}
</style>
</head>
